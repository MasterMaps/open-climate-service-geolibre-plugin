name: Release

# Auto-release on merge to main. When main's package.json version has no matching
# GitHub Release yet, this builds the plugin and publishes `v<version>` with the
# installable zip attached — so users can install via GeoLibre → Settings → Manage
# Plugins → Install from file without a Node toolchain.
#
# To cut a release: bump the version in package.json in a PR and merge it. Merges
# that don't change the version are a no-op (the version already has a release), so
# no duplicate releases are created.
on:
  push:
    branches: [main]

permissions:
  contents: write # create the tag + release and upload the zip

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so release notes can diff against the last tag

      # Read the version and decide up front, so an unrelated merge skips the build.
      - name: Check whether this version needs releasing
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists — nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "No release for v$VERSION yet — will publish."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.release == 'true'
        with:
          node-version: 20
          cache: npm

      - if: steps.check.outputs.release == 'true'
        run: npm ci

      - if: steps.check.outputs.release == 'true'
        run: npm test

      - if: steps.check.outputs.release == 'true'
        run: npm run package:geolibre

      - name: Create GitHub Release
        if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.check.outputs.version }}"
          gh release create "v$VERSION" \
            "geolibre-plugin/open-climate-service-${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "v$VERSION" \
            --generate-notes
